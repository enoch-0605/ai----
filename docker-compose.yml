services:
  mysql:
    image: mysql:8.4
    container_name: zhiguan-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: zhiguan
      MYSQL_USER: zhiguan
      MYSQL_PASSWORD: zhiguan
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - zhiguan_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  zhiguan_mysql_data:
